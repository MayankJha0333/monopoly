<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Bungee&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; width:1200px; height:630px; font-family:Outfit,sans-serif; color:#fff;
         background: radial-gradient(120% 120% at 20% 0%, #29d0e8 0%, #1782b8 40%, #0b3c63 100%);
         display:flex; align-items:center; overflow:hidden; position:relative; }
  .sun { position:absolute; right:-90px; top:-90px; width:420px; height:420px; border-radius:50%;
         background: radial-gradient(circle at 35% 35%, #fff3b8, #ffc93c 55%, #ff9e1b); opacity:.95; }
  .sea { position:absolute; left:0; right:0; bottom:0; height:190px; background:linear-gradient(#0a4f7d,#062341); }
  .wrap { position:relative; padding:0 72px; max-width:760px; }
  .brand { display:flex; align-items:center; gap:16px; margin-bottom:22px; }
  .dot { width:54px; height:54px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #fff3b8,#ffc93c 55%,#ff9e1b);
         box-shadow:0 0 0 6px rgba(255,255,255,.85); }
  .word { font-family:Bungee,Outfit,sans-serif; font-size:54px; font-weight:800; letter-spacing:.04em; text-shadow:0 4px 0 #ff5a4f, 0 8px 0 rgba(6,30,55,.4); }
  h2 { font-size:44px; line-height:1.1; margin:0 0 18px; font-weight:800; }
  p { font-size:26px; margin:0 0 26px; opacity:.95; }
  .pills { display:flex; gap:12px; }
  .pill { background:rgba(255,255,255,.16); border:2px solid rgba(255,255,255,.35); padding:10px 18px; border-radius:999px; font-size:22px; font-weight:600; }
  .board { position:absolute; right:54px; bottom:-26px; width:392px; height:392px; transform:rotate(-7deg);
           border-radius:24px; background:#f3f7ec; box-shadow:0 30px 60px rgba(3,20,40,.45); padding:14px;
           display:grid; grid-template-columns:repeat(7,1fr); grid-template-rows:repeat(7,1fr); gap:6px; }
  .board i { background:#e7eee0; border-radius:6px; }
  .board i:nth-child(3n) { background:#ffc93c; } .board i:nth-child(4n) { background:#ff5a4f; }
  .board i:nth-child(5n) { background:#42c26b; } .board i:nth-child(7n) { background:#19b3d1; }
  .board span { grid-column:2/7; grid-row:2/7; background:#dce9d5; border-radius:14px; }
</style></head><body>
<div class="sun"></div><div class="sea"></div>
<div class="board" id="b"><span></span></div>
<div class="wrap">
  <div class="brand"><div class="dot"></div><div class="word">RENT RUSH</div></div>
  <h2>Buy streets. Build houses. Collect the rent.</h2>
  <p>Free multiplayer property trading board game — in your browser.</p>
  <div class="pills"><div class="pill">4 players</div><div class="pill">~10 minutes</div><div class="pill">No download</div></div>
</div>
<script>const b=document.getElementById('b');for(let i=0;i<48;i++){const e=document.createElement('i');b.appendChild(e);}</script>
</body></html>
